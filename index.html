    <!-- Anti-FOUC Theme Script (Executed immediately before paint) -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('petualangan_pancaindra_theme');
          if (stored === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          // fallback
        }
      })();
    </script>

    <!-- Schema.org JSON-LD (@graph with EducationalApplication & Organization) -->
    <script type="application/ld+json">
